[package]
name = "dev-mutate"
version = "0.9.2"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Mutation testing for Rust. Wraps cargo-mutants: kill rate, surviving-mutant evidence, kill-rate threshold gating. Detects tests that pass without asserting. Part of the dev-* verification collection."

keywords = [
    "mutation",
    "testing",
    "cargo-mutants",
    "test-quality",
    "ci"
]

categories = [
    "development-tools",
    "development-tools::testing"
]

documentation = "https://docs.rs/dev-mutate"
repository = "https://github.com/jamesgober/dev-mutate"
homepage = "https://github.com/jamesgober/dev-mutate"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dev-report = { version = "0.9", path = "../dev-report" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
